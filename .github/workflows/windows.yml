name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rev:
        description: ooRexx SVN revision
        default: "13305"
      patchset:
        description: directory under patches/
        default: raise-condition-object
      group:
        description: test group to run first (path under test/trunk)
        default: ooRexx/API/oo/METHOD.testGroup

env:
  REV: ${{ inputs.rev || '13305' }}
  PATCHSET: ${{ inputs.patchset || 'raise-condition-object' }}
  GROUP: ${{ inputs.group || 'ooRexx/API/oo/METHOD.testGroup' }}

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export trunk and apply the patch set
        run: |
          sudo apt-get install -y -qq subversion > /dev/null
          for variant in clean patched; do
            svn export -q -r $REV https://svn.code.sf.net/p/oorexx/code-0/main/trunk src-$variant/main
            svn export -q -r $REV https://svn.code.sf.net/p/oorexx/code-0/test/trunk src-$variant/test
          done
          if [ -f patches/$PATCHSET/main.patch ]; then (cd src-patched/main && patch -p1 < $GITHUB_WORKSPACE/patches/$PATCHSET/main.patch); fi
          if [ -f patches/$PATCHSET/test.patch ]; then (cd src-patched/test && patch -p1 < $GITHUB_WORKSPACE/patches/$PATCHSET/test.patch); fi
          # the clean build runs the patched tests too, to show which fail without the patch
          if [ -f patches/$PATCHSET/test.patch ]; then (cd src-clean/test && patch -p1 < $GITHUB_WORKSPACE/patches/$PATCHSET/test.patch); fi
          if [ -d probes/$PATCHSET ]; then mkdir -p src-patched/probes && cp -r probes/$PATCHSET src-patched/probes/ && : > src-patched/probes/$PATCHSET/NUL.txt; fi
          tar czf src-clean.tgz src-clean; tar czf src-patched.tgz src-patched
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: "*.tgz"

  windows:
    needs: source
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [clean, patched]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sources
      - name: Unpack
        shell: bash
        run: tar xzf src-${{ matrix.variant }}.tgz
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..\src-${{ matrix.variant }}\main > ..\cmake.log 2>&1 || (type ..\cmake.log & exit /b 1)
          ninja > ..\ninja.log 2>&1
          set rc=%errorlevel%
          findstr /i /c:"error" /c:"warning C4" ..\ninja.log
          exit /b %rc%
      - name: Probe, one case per process
        if: matrix.variant == 'patched' && hashFiles(format('src-patched/probes/{0}/probe.rex', env.PATCHSET)) != ''
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\build\bin;$env:PATH"
          Set-Location "src-patched\probes\$env:PATCHSET"
          $cases = Select-String -Path probe.rex -Pattern "when '([a-z-]+)'" -AllMatches | ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value }
          $log = "$env:GITHUB_WORKSPACE\probe.log"
          foreach ($c in $cases) {
            $p = Start-Process -FilePath rexx -ArgumentList "probe.rex $c" -NoNewWindow -PassThru -RedirectStandardOutput o.txt -RedirectStandardError e.txt -RedirectStandardInput NUL.txt
            if (-not $p.WaitForExit(60000)) { $p.Kill(); $rc = 'TIMEOUT' } else { $rc = '0x{0:X8}' -f $p.ExitCode }
            $out = ((Get-Content o.txt, e.txt -Raw) -join ' ') -replace '\s+', ' '
            $line = "$c rc=$rc :: " + $out.Substring(0, [Math]::Min(160, $out.Length))
            Write-Output $line
            Add-Content $log $line
          }
      - name: Test group
        shell: cmd
        continue-on-error: true
        run: |
          set PATH=%GITHUB_WORKSPACE%\build\bin;%PATH%
          cd src-${{ matrix.variant }}\test
          rexx testOORexx.rex -s -S -f %GROUP% < NUL > %GITHUB_WORKSPACE%\group.log 2>&1
          type %GITHUB_WORKSPACE%\group.log
      - name: Full suite
        shell: cmd
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set PATH=%GITHUB_WORKSPACE%\build\bin;%PATH%
          cd src-${{ matrix.variant }}\test
          rexx testOORexx.rex -s < NUL > %GITHUB_WORKSPACE%\suite.log 2>&1
          findstr /c:"Tests ran" /c:"Failures" /c:"Errors" /c:"Test:" %GITHUB_WORKSPACE%\suite.log
      - name: Keep the build (patched)
        if: matrix.variant == 'patched'
        shell: bash
        run: |
          mkdir -p oorexx/api
          cp -r build/bin oorexx/bin
          cp build/lib/*.lib oorexx/api/
          cp src-patched/main/api/*.h src-patched/main/api/platform/windows/*.h oorexx/api/
      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'patched'
        with:
          name: oorexx-patched
          path: oorexx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.variant }}
          path: |
            cmake.log
            ninja.log
            group.log
            suite.log
            probe.log

  packages:
    needs: windows
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oorexx-patched
          path: oorexx
      - name: Download Rexx/SQL, Regina and SQLite
        shell: bash
        run: |
          get() { curl -sSL --retry 3 -o "$2" "https://sourceforge.net/projects/$1/download"; }
          get rexxsql/files/rexxsql/2.6/rxsql26B3_src.zip rxsql-src.zip
          get rexxsql/files/rexxsql/2.6/rxsql26B3_odbc_w64_Regina.zip rxsql-regina.zip
          get rexxsql/files/rexxsql/2.6/rxsql26B3_odbc_w64_ooRexx.zip rxsql-oorexx4.zip
          get regina-rexx/files/regina-rexx/3.9.6/Regina396w64.zip regina.zip
          for z in rxsql-src rxsql-regina rxsql-oorexx4 regina; do mkdir $z && (cd $z && unzip -q ../$z.zip); done
          find rxsql-regina rxsql-oorexx4 regina -iname "*.dll" | head -20
          vcpkg install sqlite3:x64-windows > vcpkg.log 2>&1 || tail -20 vcpkg.log
      - uses: ilammy/msvc-dev-cmd@v1
      - name: The Rexx/SQL DLLs as published, under the patched ooRexx
        shell: pwsh
        continue-on-error: true
        run: |
          $oo = "$env:GITHUB_WORKSPACE\oorexx\bin"
          foreach ($pkg in 'rxsql-regina', 'rxsql-oorexx4') {
            $dll = Get-ChildItem -Recurse $pkg -Filter rexxsql.dll | Select-Object -First 1
            $regina = Get-ChildItem -Recurse regina -Filter regina.dll | Select-Object -First 1
            $env:PATH = "$oo;$($dll.DirectoryName);$($regina.DirectoryName);$env:PATH"
            Write-Output "=== $pkg ($($dll.FullName))"
            & dumpbin /dependents $dll.FullName | Select-String '\.dll'
            & "$oo\rexx.exe" probes\rexxsql\load.rex
            Write-Output "exit $LASTEXITCODE"
          }
      - name: Build Rexx/SQL (SQLite) for ooRexx, source unchanged
        shell: cmd
        continue-on-error: true
        run: |
          set PATH=%GITHUB_WORKSPACE%\oorexx\bin;%PATH%
          set REXX_HOME=%GITHUB_WORKSPACE%\oorexx
          set SQLITE3_HOMEDIR=C:\vcpkg\installed\x64-windows
          for /d %%d in (%GITHUB_WORKSPACE%\rxsql-src\*) do set REXXSQL_SRCDIR=%%d
          if not exist %GITHUB_WORKSPACE%\rxsql-src\vcwin64.mak (echo nested) else set REXXSQL_SRCDIR=%GITHUB_WORKSPACE%\rxsql-src
          echo REXXSQL_SRCDIR=%REXXSQL_SRCDIR%
          mkdir sqlbuild
          cd sqlbuild
          nmake -nologo -f %REXXSQL_SRCDIR%\vcwin64.mak INT=OOREXX4 DB=LITE rexxsql.dll rexxsql.exe > ..\sqlbuild.log 2>&1
          set rc=%errorlevel%
          findstr /i /c:" error " /c:"fatal" /c:"unresolved" ..\sqlbuild.log
          dir *.dll *.exe
          exit /b %rc%
      - name: Run the Rexx/SQL test with the ooRexx build
        shell: cmd
        continue-on-error: true
        run: |
          set PATH=%GITHUB_WORKSPACE%\sqlbuild;%GITHUB_WORKSPACE%\oorexx\bin;C:\vcpkg\installed\x64-windows\bin;%PATH%
          cd probes\rexxsql
          rexx sqltest.rex
          echo exit %errorlevel%
          rexxsql sqltest.rex
          echo rexxsql.exe exit %errorlevel%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-packages
          path: |
            sqlbuild.log
            vcpkg.log

