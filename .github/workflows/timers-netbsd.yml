name: timers-netbsd

# .Alarm / .Ticker / SysUnix on NetBSD, before and after a revision.
# See ci/timers-netbsd.sh.

on:
  workflow_dispatch:
    inputs:
      before:
        description: revision before
        default: "13354"
      after:
        description: revision after
        default: "13355"
      runs:
        description: runs of each test group per revision
        default: "5"

jobs:
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build and run in a NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          mem: 6144
          prepare: /usr/sbin/pkg_add cmake subversion
          run: sh ci/timers-netbsd.sh ${{ inputs.before }} ${{ inputs.after }} ${{ inputs.runs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timers-netbsd
          path: timers
